# Configuration for FactorizedFireTransformer
# Simplified spatiotemporal transformer with better explainability

# Model architecture
img_size: 512                  # Input image size
patch_size: 32                 # Patch size for Vision Transformer (32 = 16x16 patches)
in_channels: 1                 # Input channels (fire state)
static_channels: 8             # Static data channels (topography, fuel, etc.)
num_classes: 1                 # Number of output classes (binary: fire/no-fire)

# Transformer settings
embed_dim: 256                 # Embedding dimension (smaller than Swin for efficiency)
spatial_depth: 4               # Number of spatial transformer layers
temporal_depth: 4              # Number of temporal transformer layers
num_heads: 8                   # Number of attention heads
dropout: 0.1                   # Dropout rate

# Training settings
optimizer_settings:
  optimizer: adamw             # AdamW optimizer (better for transformers)
  learning_rate: 0.0001        # Learning rate (lower for transformers)
  weight_decay: 0.01           # Weight decay for regularization

# Learning rate scheduler
lr_scheduler:
  scheduler: reduce_lr_on_plateau
  monitor: val_loss
  patience: 5                  # Patience epochs
  threshold: 0.001
  cooldown: 2
  factor: 0.5

# Loss function
loss_fn: unified_focal_loss    # or 'bce', 'focal_loss'
loss_fn_settings:
  weight: 0.5
  delta: 0.6
  gamma: 0.5
