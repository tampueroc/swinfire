# Trainer Configuration with W&B Logging

max_epochs: 100
accelerator: auto  # auto, gpu, cpu, mps
devices: 1
precision: 32  # 16, 32, bf16
strategy: auto  # auto, ddp, ddp_spawn
fast_dev_run: false  # Set to true for quick testing
accumulate_grad_batches: 1  # Gradient accumulation
profiler: simple  # simple, advanced

# W&B Logger Configuration
logger:
  enabled: true
  type: wandb  # 'wandb' or 'tensorboard'
  project: swinfire-scripts  # Your W&B project name
  name: precision-optimization  # Run name (will be overridden by sweep)
  entity: null  # Your W&B team/username (null = personal account)
  dir: ./wandb  # Local directory for wandb logs
  log_model: all  # 'all' uploads all checkpoints as artifacts, 'best' only best, true = last only
  # Optional: add tags
  tags: ["precision-target-85", "sweep", "decoder-enhanced"]

# Callbacks
callbacks:
  model_checkpoint:
    enabled: true
    monitor: val_precision  # Save best model by precision (target: 85%)
    mode: max  # Higher is better for precision
    save_top_k: 3  # Keep top 3 checkpoints
    save_last: true  # Also save last checkpoint
    dirpath: ./checkpoints  # Save directory
    filename: factorized-{epoch:02d}-{val_precision:.3f}  # Filename pattern
    verbose: true

  early_stopper:
    enabled: true
    monitor: val_precision  # Stop if precision plateaus
    patience: 15  # Increased patience for sweep
    mode: max  # Higher is better
    min_delta: 0.01  # Stop if no 1% improvement

  image_logger:
    enabled: true  # Enable for visual validation

  logging_callback:
    enabled: true

  final_metrics_callback:
    enabled: true
    on_training_data: false
    on_validation_data: true

  learning_rate_monitor:
    enabled: true

  # W&B Explainability Callback (NEW!)
  wandb_explainability:
    enabled: false  # DISABLED - enable after training for analysis
    log_every_n_epochs: 5  # Log explanations every N epochs
    num_samples: 3  # Number of validation samples to explain
    method: gradient  # 'gradient' or 'integrated_gradients'
